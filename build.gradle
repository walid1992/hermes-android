// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

// Library coordinates — used by submodule publish configs
ext {
    groupId = 'com.github.walid1992.hermes-android'
    versionName = '0.1.0'
    versionCode = 1
}

// Configure maven repositories for all publishing subprojects
subprojects {
    afterEvaluate {
        if (plugins.hasPlugin('maven-publish')) {
            publishing {
                repositories {
                    // Local repo for testing
                    maven {
                        name = "local"
                        url = uri("${rootProject.buildDir}/maven-repo")
                    }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
