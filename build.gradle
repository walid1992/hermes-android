// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

// Library coordinates — used by submodule publish configs
ext {
    groupId = 'com.aspect.hermes'
    versionName = '0.1.0'
    versionCode = 1
}

// Configure maven repositories for all publishing subprojects
subprojects {
    afterEvaluate {
        if (plugins.hasPlugin('maven-publish')) {
            publishing {
                repositories {
                    // GitHub Packages
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/walid1992/hermes-android")
                        credentials {
                            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: ""
                            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: ""
                        }
                    }
                    // Local repo for testing
                    maven {
                        name = "local"
                        url = uri("${rootProject.buildDir}/maven-repo")
                    }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
