plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.hermes.wrapper'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
            version "3.22.1"
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation project(':hermes-engine')
    implementation 'androidx.annotation:annotation:1.7.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = rootProject.ext.groupId
                artifactId = 'wrapper-android'
                version = rootProject.ext.versionName

                pom {
                    name = 'Hermes Android Wrapper'
                    description = 'Android wrapper for Hermes JS engine with QuickJS-compatible API'
                    url = 'https://github.com/walid1992/hermes-android'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                }
            }
        }
    }
}
